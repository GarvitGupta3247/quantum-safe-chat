name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Browser end-to-end test (uses the runner's preinstalled Google Chrome)
        run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm audit --omit=dev --audit-level=high
